      - generic [ref=e247]:
        - generic [ref=e248]:
          - heading "Live Web-AI Capture" [level=3] [ref=e252]
          - paragraph [ref=e253]: A browser extension saves your ChatGPT, Claude.ai, and Gemini conversations into your memory as you chat — verbatim, local, a few seconds after each reply. No exporting. It can only add transcripts, never read your memory. The only way to keep Gemini's replies (Google's own export leaves them out).
