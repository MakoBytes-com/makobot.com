          - heading "Autopilot — No Babysitting" [level=3] [ref=e258]
          - paragraph [ref=e259]: MakoBot decides which memories and skills are worth keeping — good ones saved, junk discarded, stale ones archived (filed, never destroyed, always undoable). The old approve/reject queue is gone; every decision shows in a plain-English activity feed. Two toggles (memory + skills) if you'd rather review it yourself.
        - generic [ref=e260]:
          - heading "Smart Search (Semantic)" [level=3] [ref=e269]
          - paragraph [ref=e270]: Find memories by MEANING, not keywords — 'that email env var problem' finds the CONTACT_EMAIL_TO note. One click downloads a small (140 MB) embedding model and indexes your whole memory tree. Runs 100% on your machine, and upgrades both in-app search and the memory search every connected AI uses.
        - generic [ref=e271]:
          - heading "MakoSync — Every Computer" [level=3] [ref=e274]
          - paragraph [ref=e275]: Your brain on every machine you own — no server, no account. Each computer writes small AES-256-encrypted change packets into a folder you already sync (OneDrive built in; Dropbox, Google Drive, NAS all work). Only you hold the passphrase. Merging can only ever ADD — a fresh laptop can never wipe your desktop's memory.
        - generic [ref=e276]:
          - heading "Memory Health" [level=3] [ref=e279]
